<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelLog TH - บันทึกการเติมน้ำมัน</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="text-gray-800 pb-12">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-lg sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">⛽</span>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">FuelLog TH</h1>
                    <p class="text-xs text-blue-200">สมุดบันทึกการเติมน้ำมัน & คำนวณอัตราสิ้นเปลือง</p>
                </div>
            </div>
            <button onclick="exportCSV()" class="bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-2 rounded-lg transition flex items-center gap-1">
                <span>📥</span> Export CSV
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-6 space-y-6">

        <!-- Dashboard Summary -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500">อัตราสิ้นเปลืองเฉลี่ย</p>
                <p class="text-xl font-bold text-emerald-600 mt-1" id="avgConsumption">0.00 <span class="text-xs font-normal text-gray-500">กม./ลิตร</span></p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500">ค่าใช้จ่ายเฉลี่ย</p>
                <p class="text-xl font-bold text-blue-600 mt-1" id="avgCostPerKm">0.00 <span class="text-xs font-normal text-gray-500">บาท/กม.</span></p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500">ค่าน้ำมันรวมทั้งหมด</p>
                <p class="text-xl font-bold text-gray-800 mt-1" id="totalSpent">0 <span class="text-xs font-normal text-gray-500">บาท</span></p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500">ระยะทางที่บันทึก</p>
                <p class="text-xl font-bold text-indigo-600 mt-1" id="totalDistance">0 <span class="text-xs font-normal text-gray-500">กม.</span></p>
            </div>
        </div>

        <!-- Add Fuel Form -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-base font-semibold text-gray-800 mb-4 flex items-center gap-2">
                <span>➕</span> บันทึกการเติมน้ำมันครั้งใหม่
            </h2>
            <form id="fuelForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">วันที่เติม</label>
                        <input type="date" id="date" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">เลขไมล์ปัจจุบัน (Odometer - กม.)</label>
                        <input type="number" step="0.1" id="odometer" placeholder="เช่น 45200" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">ปั๊มน้ำมัน</label>
                        <select id="station" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-white">
                            <option value="PTT (ปตท.)">PTT (ปตท.)</option>
                            <option value="Bangchak (บางจาก)">Bangchak (บางจาก)</option>
                            <option value="Shell (เชลล์)">Shell (เชลล์)</option>
                            <option value="PT (พีที)">PT (พีที)</option>
                            <option value="Caltex (คาลเท็กซ์)">Caltex (คาลเท็กซ์)</option>
                            <option value="Esso/Bangchak">Esso (เอสโซ่)</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">ประเภทน้ำมัน</label>
                        <select id="fuelType" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-white">
                            <option value="แก๊สโซฮอล์ 95">แก๊สโซฮอล์ 95</option>
                            <option value="แก๊สโซฮอล์ 91">แก๊สโซฮอล์ 91</option>
                            <option value="E20">E20</option>
                            <option value="ดีเซล B7">ดีเซล B7</option>
                            <option value="ดีเซลพรีเมียม">ดีเซลพรีเมียม</option>
                            <option value="เบนซิน 95">เบนซิน 95</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">ราคา/ลิตร (บาท)</label>
                        <input type="number" step="0.01" id="pricePerLiter" placeholder="38.55" required oninput="calcTotal('price')" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">จำนวนลิตร</label>
                        <input type="number" step="0.001" id="liters" placeholder="25.94" required oninput="calcTotal('liters')" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center pt-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">ยอดเงินรวม (บาท)</label>
                        <input type="number" step="0.01" id="totalCost" placeholder="1000" required oninput="calcTotal('total')" class="w-full px-3 py-2 bg-blue-50 border border-blue-200 text-blue-900 font-semibold rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                    <div class="flex items-center space-x-2 pt-4">
                        <input type="checkbox" id="fullTank" checked class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
                        <label for="fullTank" class="text-sm text-gray-700">เติมเต็มถัง (ใช้คำนวณ กม./ลิตร ได้แม่นยำ)</label>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl shadow transition duration-200">
                    บันทึกข้อมูล
                </button>
            </form>
        </div>

        <!-- History List -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-semibold text-gray-800 flex items-center gap-2">
                    <span>📋</span> ประวัติการเติมน้ำมัน
                </h2>
                <button onclick="clearAllData()" class="text-xs text-red-500 hover:underline">ล้างข้อมูลทั้งหมด</button>
            </div>
            
            <div id="logList" class="space-y-3">
                <!-- Items will be injected here -->
            </div>
        </div>

    </main>

    <script>
        // Set default date to today
        document.getElementById('date').valueAsDate = new Date();

        // Load logs from LocalStorage
        let logs = JSON.parse(localStorage.getItem('fuelLogsTH')) || [];

        // Auto calculate fields
        function calcTotal(changedField) {
            const price = parseFloat(document.getElementById('pricePerLiter').value);
            const liters = parseFloat(document.getElementById('liters').value);
            const total = parseFloat(document.getElementById('totalCost').value);

            if (changedField === 'price' || changedField === 'liters') {
                if (!isNaN(price) && !isNaN(liters)) {
                    document.getElementById('totalCost').value = (price * liters).toFixed(2);
                }
            } else if (changedField === 'total') {
                if (!isNaN(total) && !isNaN(price) && price > 0) {
                    document.getElementById('liters').value = (total / price).toFixed(3);
                }
            }
        }

        // Form Submit
        document.getElementById('fuelForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newLog = {
                id: Date.now(),
                date: document.getElementById('date').value,
                odometer: parseFloat(document.getElementById('odometer').value),
                station: document.getElementById('station').value,
                fuelType: document.getElementById('fuelType').value,
